[project]
name = "smlt-hedge"
version = "0.1.0"
description = "Point-in-time residual-risk hedging research for a fixed SMLT position (HSE MSc, FMFI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "requests>=2.32",
  "tabulate>=0.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smlt_hedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
